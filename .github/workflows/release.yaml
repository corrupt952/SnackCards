name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch: {}
  push:
    tags:
      - "*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Export current version
        run: echo "SNACK_CARDS_VERSION=v$(jq -r .version package.json)" >> $GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm zip
      - name: Find zip file
        id: find_zip
        run: |
          ZIP_FILE=$(find .output -name "*.zip" -type f -print -quit)
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP_FILE: ${{ steps.find_zip.outputs.zip_file }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP_FILE}" \
            --verify-tag \
            --title "Release ${SNACK_CARDS_VERSION}" \
            --notes ""
